version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: frontback19
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  backend-1:
    build: ./backend
    container_name: backend-1
    environment:
      - PORT=3001
      - SERVER_ID=backend-1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=frontback19
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  backend-2:
    build: ./backend
    container_name: backend-2
    environment:
      - PORT=3002
      - SERVER_ID=backend-2
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=frontback19
      - DB_USER=postgres
      - DB_PASSWORD=password
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    build: ./frontend
    container_name: nginx-balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-1
      - backend-2
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
